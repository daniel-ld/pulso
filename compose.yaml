name: pulso-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulso
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes: [pulso-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pulso -d pulso"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: infra/api.Dockerfile, target: runtime }
    environment:
      DATABASE_URL: postgresql://pulso:${POSTGRES_PASSWORD}@db:5432/pulso
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4173}
      SETUP_KEY: ${SETUP_KEY:?Define SETUP_KEY in .env}
      NODE_ENV: development
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on: { db: { condition: service_healthy } }
    networks: [private, edge]
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: infra/web.Dockerfile }
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:4173:80"]
    networks: [private, edge]
    restart: unless-stopped
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      {
        POSTGRES_DB: pulso_test,
        POSTGRES_USER: test,
        POSTGRES_PASSWORD: test-only-disposable,
      }
    tmpfs: [/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U test -d pulso_test"]
      interval: 2s
      retries: 20
  test:
    build: { context: ., dockerfile: infra/api.Dockerfile, target: test }
    profiles: [test]
    environment:
      DATABASE_URL: postgresql://test:test-only-disposable@test-db:5432/pulso_test
      SETUP_KEY: test-only-setup-key-at-least-32-characters
      APP_ORIGIN: http://localhost:4173
    depends_on: { test-db: { condition: service_healthy } }
    networks: [private]
networks:
  private: { internal: true }
  edge: {}
volumes:
  pulso-data:
