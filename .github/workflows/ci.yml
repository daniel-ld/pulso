name: Validate Pulso
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pulso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-disposable
          POSTGRES_DB: pulso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d pulso_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://test:test-only-disposable@127.0.0.1:5432/pulso_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
