  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  add_header CDN-Cache-Control "no-store" always;
  add_header Cloudflare-CDN-Cache-Control "no-store" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;
