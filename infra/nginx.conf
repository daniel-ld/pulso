server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  include /etc/nginx/web-headers.conf;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location ~ ^/(mcp(/|$)|oauth(/|$)|\.well-known(/|$)) {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp_api http://api:3001;
    proxy_pass $mcp_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  location /api/ {
    # Runtime DNS supports API container replacement without restarting this gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3001;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location = /refresh {
    include /etc/nginx/web-headers.conf;
    add_header Clear-Site-Data '"cache"' always;
    try_files /refresh.html =404;
  }
  location = /sw.js { try_files $uri =404; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
