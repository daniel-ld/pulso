server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ {
    # Runtime DNS supports API container replacement without restarting this gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3001;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control no-store always;
  }
  location = /sw.js { add_header Cache-Control 'no-cache, no-store, must-revalidate'; try_files $uri =404; }
  location = /index.html { add_header Cache-Control no-cache; }
  location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
